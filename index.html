<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveCanvas — video review deck</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f4ed;
        --ink: #293a32;
        --muted: #627067;
        --line: #d9dfd5;
        --accent: #365b46;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      select,
      textarea {
        outline-offset: 5px;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--accent);
      }
      header {
        min-height: 76px;
        padding: 12px max(24px, calc((100vw - 1320px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #292b26;
      }
      .brand span {
        font-family: "EB Garamond", Georgia, serif;
        font-size: 27px;
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.15;
      }
      .brand-mark {
        width: 29px;
        height: 29px;
      }
      .header-copy {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .jump {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        min-width: 0;
        max-width: 430px;
      }
      .jump label {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .jump select {
        width: 360px;
        min-width: 0;
        max-width: 100%;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-overflow: ellipsis;
      }
      main {
        max-width: 1320px;
        margin: auto;
        padding: 18px 28px 8px;
        min-height: calc(100vh - 148px);
      }
      .slide[hidden] {
        display: none;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        margin: 0 0 6px;
      }
      h1,
      h2 {
        font:
          400 clamp(32px, 4vw, 54px)/1.13 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: -1.4px;
        margin: 0 0 17px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 16px;
      }
      .lede {
        max-width: 770px;
        font-size: 18px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        border: 1px solid #cbd8c5;
        background: #edf2e8;
        color: #40543d;
        padding: 5px 11px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 650;
      }
      .intro {
        padding: 24px 0 12px;
      }
      .intro h1 {
        max-width: 800px;
        font-size: clamp(40px, 5vw, 64px);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin: 26px 0;
      }
      .card {
        padding: 24px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 16px;
      }
      .card p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 0;
      }
      .step {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 12px;
      }
      .video-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 25px;
      }
      .video-heading h2 {
        font-size: clamp(25px, 2.6vw, 34px);
        margin-bottom: 7px;
      }
      .video-heading .description {
        max-width: 870px;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 9px;
      }
      .metadata {
        white-space: nowrap;
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        background: #eceee6;
        border-radius: 7px;
      }
      .video-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 18px;
        margin-top: 12px;
        align-items: start;
      }
      .player {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        max-height: max(240px, calc(100svh - 360px));
        background: #eaece5;
        object-fit: contain;
      }
      .player-footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 8px 13px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      .review-sidebar {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fff;
      }
      .review-sidebar h3:not(:first-child) {
        margin-top: 22px;
      }
      ul {
        padding-left: 19px;
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      li {
        margin-bottom: 9px;
      }
      .notes {
        margin-top: 10px;
      }
      details > summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
      }
      .notes-panel {
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .notes-panel[open] > summary {
        margin-bottom: 10px;
      }
      .review-sidebar summary {
        font-size: 13px;
      }
      .review-sidebar[open] summary {
        margin-bottom: 14px;
      }
      .review-sidebar h3 {
        font-size: 12px;
      }
      .review-column {
        max-height: max(276px, calc(100svh - 324px));
        overflow-y: auto;
        scrollbar-width: thin;

        min-width: 0;
      }
      .video-context {
        margin-top: 10px;
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .video-context p {
        margin: 7px 0 0;
      }

      .notes label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .notes textarea {
        width: 100%;
        min-height: 92px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        resize: vertical;
        font-size: 14px;
      }
      .privacy {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .button {
        padding: 10px 17px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }
      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      footer {
        max-width: 1320px;
        padding: 12px 28px 16px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .navigation {
        display: flex;
        gap: 10px;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .track {
        width: 170px;
        height: 3px;
        background: #d9dfd5;
        border-radius: 3px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--accent);
      }
      .feedback {
        max-width: 960px;
        padding: 32px 0;
      }
      .feedback ol {
        padding-left: 23px;
      }
      .feedback li {
        margin: 16px 0;
      }
      .feedback .lede {
        margin-bottom: 25px;
      }
      .export-status {
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 950px) {
        .video-layout {
          grid-template-columns: 1fr;
        }
        video {
          max-height: none;
        }
        .review-column {
          max-height: none;
          overflow: visible;
        }
        .review-sidebar h3:not(:first-child) {
          margin-top: 0;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .video-heading {
          display: block;
        }
        .metadata {
          padding-top: 0;
          margin-bottom: 12px;
        }
        .jump select {
          max-width: 280px;
        }
      }
      @media (max-width: 560px) {
        header {
          padding: 12px 16px;
          flex-direction: column;
          gap: 12px;
        }
        .jump {
          width: 100%;
          max-width: none;
          flex-direction: row;
          align-items: center;
        }
        .jump select {
          max-width: none;
          flex: 1;
        }
        .header-copy {
          margin-top: 3px;
        }
        main {
          padding: 20px 16px 8px;
        }
        .review-sidebar {
          display: block;
        }
        .review-sidebar h3:not(:first-child) {
          margin-top: 20px;
        }
        footer {
          padding: 16px;
          flex-wrap: wrap;
        }
        .track {
          width: 80px;
        }
        .player-footer {
          flex-wrap: wrap;
        }
        .intro {
          padding-top: 12px;
        }
        .progress {
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand">
          <img
            class="brand-mark"
            src="brand/mark.svg"
            alt=""
            width="36"
            height="36"
          /><span>LiveCanvas</span>
        </div>
        <div class="header-copy">Conversation, made visible · Review deck</div>
      </div>
      <nav class="jump" aria-label="Slide navigation">
        <label for="slide-select">Recording</label
        ><select id="slide-select"></select>
      </nav>
    </header>
    <main id="slides"></main>
    <footer>
      <div class="progress">
        <span id="slide-count" aria-live="polite"></span>
        <div class="track" aria-hidden="true">
          <div class="fill" id="progress-fill"></div>
        </div>
        <span>← / → to browse</span>
      </div>
      <div class="navigation">
        <button class="button" id="previous">← Previous</button
        ><button class="button primary" id="next">Next →</button>
      </div>
    </footer>
    <script id="review-data" type="application/json">
      [{"id":"conversation","title":"Four domains, one evidence model","section":"showcase","subtitle":"Architecture · business decisions · onboarding · casual discussion","description":"A paced walkthrough of four synthetic discussions, showing source speakers, different visual objects and correction history.","watchFor":["Speaker badges connect claims to source words.","Borders and labelled arrows give relationships readable endpoints.","Proposed and removed ideas retain distinct states."],"questions":["Can you explain what the arrows mean?","Do the colors read as source attribution rather than ownership?","Which discussion still feels forced into an architecture diagram?"],"file":"media/conversation.mp4","poster":"media/conversation.jpg","duration":162.12,"width":1920,"height":1080},{"id":"visual-story","title":"Minimal illustrated conversation","section":"showcase","subtitle":"People, places and activities in turn-by-turn panels","description":"A casual conversation shown as bounded illustrated panels, followed by evidence inspection and the connected editable canvas.","watchFor":["Recurring symbolic people and activities.","Exact source excerpts beside current labels and statuses.","Rejected ideas remain inspectable in history."],"questions":["Can you distinguish current decisions from historical quotes?","Do panels help you follow the conversation?","Does the connected canvas add clarity?"],"file":"media/visual-story.mp4","poster":"media/visual-story.jpg","duration":73.76,"width":1920,"height":1080},{"id":"discussion-experiments","title":"One long monologue, four readings","section":"showcase","subtitle":"The same evidence, several presentations","description":"A condensed comparison of a fully loaded 1,688-word synthetic solo voice memo about a stalled client website: conflicting feedback, payment, scope and unclear approval authority.","watchFor":["Conversation panels preserve the speaker’s progression.","Topic sections gather nonadjacent revisits.","Topic diagrams and the editable canvas expose relationships."],"questions":["What blocks developer handoff?","Is Tuesday a payment promise or a follow-up date?","Is the final approver known?","Which view answers each question fastest?"],"file":"media/discussion-experiments.mp4","poster":"media/discussion-experiments.jpg","duration":65.36,"width":1920,"height":1080},{"id":"baseline","title":"First replay walkthrough","section":"archive","subtitle":"Earlier baseline · retained for comparison","description":"The earlier compact replay preview. Compare this baseline with the later multi-domain and illustrated presentations.","watchFor":["The original interaction and diagram vocabulary.","How readable the evidence and controls feel."],"questions":["What became clearer in the later demos?","Which simple interaction should we retain?"],"file":"media/baseline.mp4","poster":"media/baseline.jpg","duration":62.2,"width":1440,"height":960},{"id":"scenarios-first","title":"Four-scenario exploration — first take","section":"archive","subtitle":"Earlier condensed exploration","description":"An earlier condensed pass through architecture, business planning, onboarding and casual discussion. This is an older take, not an additional product capability.","watchFor":["How each domain is represented.","Pacing versus the later Full HD walkthrough."],"questions":["Where do you need more time to read?","Which visual form fits its discussion best?"],"file":"media/scenarios-first.mp4","poster":"media/scenarios-first.jpg","duration":89.24,"width":1440,"height":960},{"id":"scenarios-second","title":"Four-scenario exploration — second take","section":"archive","subtitle":"Earlier alternate recording","description":"A second condensed recording of the same four-domain exploration, preserved so reviewers can compare presentation and pacing.","watchFor":["Readability while the conversation advances.","Consistency between domains."],"questions":["Is this pacing easier to follow than the first take?","Which moment is difficult to understand?"],"file":"media/scenarios-second.mp4","poster":"media/scenarios-second.jpg","duration":91.68,"width":1440,"height":960},{"id":"conversation-earlier","title":"Speaker-aware canvas — earlier take","section":"archive","subtitle":"Earlier Full HD discussion-canvas iteration","description":"An earlier paced four-domain canvas with speaker accents, borders and illustrated objects. Compare it with the featured four-domain clip.","watchFor":["Colors indicate supporting speakers, not agreement.","Illustrated objects remain attached to an explicit graph."],"questions":["Are multiple contributors understandable?","Do the borders and labels help identify each relationship?"],"file":"media/conversation-earlier.mp4","poster":"media/conversation-earlier.jpg","duration":164.92,"width":1920,"height":1080},{"id":"discussion-draft","title":"Long-monologue comparison — before label polish","section":"archive","subtitle":"Earlier take · known label crowding","description":"The earlier recording of the same monologue comparison. Long labels crowded the topic sections; the featured version adds wrapping and wider illustrated objects.","watchFor":["Compare topic-label readability with the featured clip.","The same panels, sections, diagrams and canvas are available."],"questions":["Does the newer label treatment improve readability?","What crowding or wasted space remains?"],"file":"media/discussion-draft.mp4","poster":"media/discussion-draft.jpg","duration":65.56,"width":1920,"height":1080}]
    </script>
    <script>
      (() => {
        const videos = JSON.parse(
          document.getElementById("review-data").textContent,
        );
        const escape = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const storageKey = "livecanvas-review-notes-v1";
        let notes = {};
        try {
          notes = JSON.parse(localStorage.getItem(storageKey) || "{}");
        } catch {}
        const items = [
          { id: "intro", title: "Welcome" },
          ...videos,
          { id: "feedback", title: "Your feedback" },
        ];
        const list = (values) =>
          "<ul>" +
          values.map((value) => "<li>" + escape(value) + "</li>").join("") +
          "</ul>";
        const time = (value) =>
          Math.floor(value / 60) +
          ":" +
          String(Math.floor(value % 60)).padStart(2, "0");
        const slides = document.getElementById("slides");
        slides.innerHTML = `<section class="slide intro" id="intro"><p class="eyebrow">An open product experiment</p><h1>Can a conversation become something you can see?</h1><p class="lede">LiveCanvas turns conversation into meaning, suitable visual objects, arrangement, and an evidence-backed canvas. These recordings show how that idea has evolved.</p><span class="badge">${videos.length} recordings · silent synthetic replays</span><div class="cards"><div class="card"><span class="step">01 / Explore the current direction</span><h3>Three showcase recordings</h3><p>Start with multiple use cases, try illustrated conversation panels, then compare different views of one long monologue.</p></div><div class="card"><span class="step">02 / See the experiments</span><h3>Earlier takes, kept intact</h3><p>The archive shows previous pacing and presentation choices. These are iterations, rather than additional product promises.</p></div><div class="card"><span class="step">03 / Tell us what makes sense</span><h3>Review understanding</h3><p>What can you explain from the visuals? Which relationships remain unclear? Your optional notes stay in this browser.</p></div></div><p class="small">This is a review deck, not the live application. The videos use prepared synthetic transcripts and graph events. They do not measure live speech recognition, model interpretation, speaker identification or latency. Video controls let you pause, seek and enter full screen.</p></section>`;
        videos.forEach((video, index) => {
          const section = document.createElement("section");
          section.className = "slide";
          section.id = video.id;
          section.hidden = true;
          section.innerHTML = `<div class="video-heading"><div><p class="eyebrow">${video.section === "archive" ? "Archive / earlier experiment" : "Showcase / current direction"} · ${index + 1} of ${videos.length}</p><h2>${escape(video.title)}</h2><p class="description">${escape(video.subtitle)}</p></div><div class="metadata">${time(video.duration)} · ${video.width} × ${video.height}</div></div><span class="badge">Silent synthetic replay · prepared transcript and graph events</span><div class="video-layout"><div><div class="player"><video controls playsinline preload="none" aria-label="${escape(video.title)}" ${video.poster ? 'poster="' + escape(video.poster) + '"' : ""}><source src="${escape(video.file)}" type="video/mp4">Your browser cannot play this video. <a href="${escape(video.file)}">Download the MP4</a>.</video><div class="player-footer"><span>Pause or seek to inspect the canvas.</span><a href="${escape(video.file)}" download>Download video ↓</a></div></div></div><aside class="review-column"><details class="review-sidebar" open aria-label="Review prompts"><summary>Review guide</summary><div><h3>Watch for</h3>${list(video.watchFor)}</div><div><h3>Questions to consider</h3>${list(video.questions)}</div></details><details class="video-context"><summary>About this experiment</summary><p class="small">${escape(video.description)}</p></details><details class="notes notes-panel"><summary>Add review notes</summary><label for="notes-${escape(video.id)}">Your review notes</label><textarea id="notes-${escape(video.id)}" data-notes="${escape(video.id)}" placeholder="What was clear? What needs another iteration?">${escape(notes[video.id] || "")}</textarea><p class="privacy">Saved locally when available. Nothing is sent anywhere. Export your notes on the final slide.</p></details></aside></div>`;
          slides.append(section);
        });
        const final = document.createElement("section");
        final.id = "feedback";
        final.className = "slide feedback";
        final.hidden = true;
        final.innerHTML =
          '<p class="eyebrow">Help shape the next experiment</p><h2>What helped you understand?</h2><p class="lede">The goal is a clear, minimal visual explanation of conversation. We are comparing approaches before settling on a default.</p><ol><li>Which recording or view felt most useful, and for what situation?</li><li>Could you distinguish what was said, what was proposed, and what changed?</li><li>Did the arrows, borders, illustrations and speaker colors explain their purpose?</li><li>What could you confidently explain from the canvas? Where did you need the transcript?</li><li>What would make you use this for a real conversation?</li></ol><button class="button primary" id="export-notes">Export review notes ↓</button><p class="export-status" id="export-status" role="status"></p><p class="small">The export is a Markdown file you can share through your preferred channel. This deck has no feedback submission service. Include the recording title and, when useful, a video timestamp.</p>';
        slides.append(final);
        const select = document.getElementById("slide-select");
        select.innerHTML = items
          .map(
            (item, i) =>
              '<option value="' +
              i +
              '">' +
              (i > 0 && i < items.length - 1
                ? i + " / " + videos.length + " · "
                : "") +
              escape(item.title) +
              "</option>",
          )
          .join("");
        let active = 0;
        function show(index, updateHash = true) {
          active = Math.max(0, Math.min(items.length - 1, index));
          document.querySelectorAll(".slide").forEach((slide, i) => {
            slide.hidden = i !== active;
            const player = slide.querySelector("video");
            if (player) {
              player.pause();
              player.preload = i === active ? "metadata" : "none";
            }
          });
          select.value = String(active);
          document.getElementById("previous").disabled = active === 0;
          document.getElementById("next").disabled =
            active === items.length - 1;
          document.getElementById("slide-count").textContent =
            "Slide " + (active + 1) + " of " + items.length;
          document.getElementById("progress-fill").style.width =
            ((active + 1) / items.length) * 100 + "%";
          if (updateHash)
            history.replaceState(null, "", "#" + items[active].id);
          window.scrollTo(0, 0);
        }
        function fromHash() {
          let id;
          try {
            id = decodeURIComponent(location.hash.slice(1));
          } catch {
            id = "intro";
          }
          const index = items.findIndex((item) => item.id === id);
          show(index < 0 ? 0 : index, false);
        }
        document.getElementById("previous").onclick = () => show(active - 1);
        document.getElementById("next").onclick = () => show(active + 1);
        select.onchange = () => show(Number(select.value));
        window.addEventListener("hashchange", fromHash);
        document.addEventListener("keydown", (event) => {
          if (
            event.altKey ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.target.closest(
              "input,textarea,select,button,a,video,[contenteditable]",
            )
          )
            return;
          if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            event.preventDefault();
            show(active + (event.key === "ArrowRight" ? 1 : -1));
          }
        });
        document.querySelectorAll("[data-notes]").forEach((input) =>
          input.addEventListener("input", () => {
            notes[input.dataset.notes] = input.value;
            try {
              localStorage.setItem(storageKey, JSON.stringify(notes));
            } catch {}
          }),
        );
        document.getElementById("export-notes").onclick = () => {
          const lines = [
            "# LiveCanvas video review",
            "",
            "Recordings are silent synthetic replays; these notes review the presentation.",
            "",
          ];
          videos.forEach((video) => {
            lines.push(
              "## " + video.title,
              "",
              "Video: " + video.file,
              "",
              "Review notes:",
              notes[video.id]?.trim() || "(No notes yet.)",
              "",
            );
          });
          const blob = new Blob([lines.join("\n")], {
            type: "text/markdown;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "livecanvas-review-notes.md";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          document.getElementById("export-status").textContent =
            "Your notes were exported. Share the file through your preferred channel.";
        };
        fromHash();
      })();
    </script>
  </body>
</html>
